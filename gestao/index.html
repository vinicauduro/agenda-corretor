<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotifly mudou de endereço</title>
<meta name="robots" content="noindex">
<script>
  /* O sistema de gestão (Lotifly) saiu desta pasta e ganhou o repositório dele. Leva junto o
     que vem depois do endereço: ?convite=, ?modo=corretor e o #, para convites e links
     antigos continuarem funcionando. */
  var NOVO = 'https://vinicauduro.github.io/Lotifly/';
  location.replace(NOVO + location.search + location.hash);
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
  .box { background: #fff; border-radius: 12px; padding: 24px; max-width: 420px; text-align: center; box-shadow: 0 6px 18px rgba(15,23,42,.08); }
  a { color: #0e4c73; font-weight: 700; }
</style>
</head>
<body>
  <div class="box">
    <h1 style="font-size:1.2rem">O sistema mudou de endereço</h1>
    <p>Agora ele fica em <a id="novo" href="https://vinicauduro.github.io/Lotifly/">vinicauduro.github.io/Lotifly</a>.</p>
    <p style="font-size:.9rem;color:#475569">Se você instalou o app no celular ou no computador, abra o endereço novo e instale de novo. Seus dados continuam lá.</p>
  </div>
</body>
</html>
